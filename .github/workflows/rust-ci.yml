name: Rust CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/**'
      - 'docs/**'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          show-progress: false

      - name: Verify exact head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Reject credential-like tracked content
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nEI 'gh[pousr]_[A-Za-z0-9]{20,}|lin_api_[A-Za-z0-9]{20,}|BEGIN [A-Z ]*PRIVATE KEY' -- . ':!Cargo.lock'; then
            echo 'Credential-shaped tracked content is forbidden.' >&2
            exit 1
          fi

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt

      - name: Resolve dependency graph
        run: cargo +1.88.0 metadata --format-version 1 --no-deps >/tmp/metadata.json

      - name: Check formatting
        run: cargo +1.88.0 fmt --all --check

      - name: Lint
        run: cargo +1.88.0 clippy --all-targets --all-features -- -D warnings

      - name: Test all targets
        run: cargo +1.88.0 test --all-targets --all-features

  format-promote-once:
    name: Promote pinned rustfmt output once
    if: github.event_name == 'pull_request' && github.repository == 'ores-otel/ores-otel-api-server.rs' && github.actor == 'ORESoftware' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/four-transports'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 2
          show-progress: false

      - name: Verify immutable promotion parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '04f1894132e0a8917bcbe6282d96c9fcae893365'

      - name: Install pinned rustfmt
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt

      - name: Format Rust sources only
        run: cargo +1.88.0 fmt --all

      - name: Require Rust-source-only changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -gt 0
          for path in "${changed[@]}"; do
            case "$path" in
              *.rs) ;;
              *) echo "Refusing non-Rust formatter change: $path" >&2; exit 1 ;;
            esac
          done

      - name: Commit deterministic rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply pinned rustfmt to four-transport branch'

      - name: Push formatted exact head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_HEAD_REF}"

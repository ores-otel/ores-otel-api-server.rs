name: conformance-boundary

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/lib.rs'
      - 'src/routes/**'
      - 'src/rpc/**'
      - 'src/graphql/**'
      - 'src/server.rs'
      - 'contracts/**'
      - 'contract-admission/**'
      - 'conformance/**'
      - 'governance/**'
      - 'generated/**'
      - '.github/workflows/conformance-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/lib.rs'
      - 'src/routes/**'
      - 'src/rpc/**'
      - 'src/graphql/**'
      - 'src/server.rs'
      - 'contracts/**'
      - 'contract-admission/**'
      - 'conformance/**'
      - 'governance/**'
      - 'generated/**'
      - '.github/workflows/conformance-boundary.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check
      - name: Check conformance and routing governance
        run: |
          set -euo pipefail
          node --check conformance/check.mjs
          node conformance/check.mjs
          node --check governance/check.mjs
          node governance/check.mjs
      - name: Require tracked lock and compile exact dependency graph
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch Cargo.lock >/dev/null
          test -f Cargo.lock
          if git check-ignore -q Cargo.lock; then
            echo 'Cargo.lock must not be ignored in this application repository' >&2
            exit 1
          fi
          cargo check --locked --all-targets
          git diff --exit-code -- Cargo.toml Cargo.lock src/lib.rs src/routes/ src/rpc/ src/graphql/ src/server.rs contracts/ contract-admission/ conformance/ governance/ generated/

name: Runtime config conformance

on:
  pull_request:
    paths:
      - '.ores-mw.toml'
      - '.ores-rl.toml'
      - '.ores-lru.toml'
      - '.ores-otel.toml'
      - '.shared-auth.toml'
      - 'config/ores-middleware-stack.json'
      - 'conformance/check-runtime-configs.rs'
      - '.github/workflows/runtime-config-conformance.yml'
  push:
    branches: [main]
    paths:
      - '.ores-mw.toml'
      - '.ores-rl.toml'
      - '.ores-lru.toml'
      - '.ores-otel.toml'
      - '.shared-auth.toml'
      - 'config/ores-middleware-stack.json'
      - 'conformance/check-runtime-configs.rs'
      - '.github/workflows/runtime-config-conformance.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact revision and clean patch
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git diff --check

      - name: Install pinned Rust 1.88
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.88.0

      - name: Build dependency-free checker
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2024 -D warnings -o "$RUNNER_TEMP/check-runtime-configs" conformance/check-runtime-configs.rs

      - name: Prove exact-head runtime contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/check-runtime-configs"
          node conformance/check.mjs
          node governance/check.mjs
          git diff --exit-code

      - name: Prove fail-closed drift detection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bad-refill" "$RUNNER_TEMP/bad-header"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/bad-refill"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/bad-header"

          sed -i 's/"refillPerSecond": 2.0/"refillPerSecond": 3.0/' "$RUNNER_TEMP/bad-refill/config/ores-middleware-stack.json"
          if (cd "$RUNNER_TEMP/bad-refill" && "$RUNNER_TEMP/check-runtime-configs"); then
            echo 'checker accepted token refill drift' >&2
            exit 1
          fi

          sed -i 's/x-ores-test-auth-bypass/x-test-auth-bypass/' "$RUNNER_TEMP/bad-header/config/ores-middleware-stack.json"
          if (cd "$RUNNER_TEMP/bad-header" && "$RUNNER_TEMP/check-runtime-configs"); then
            echo 'checker accepted extension-header namespace drift' >&2
            exit 1
          fi
